[project]
name = "project-11"
version = "0.1.0"
description = ""
authors = [
    {name = "hhdonglo",email = "hkdonglo@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "streamlit (>=1.55.0,<2.0.0)",
    "langchain (>=1.2.13,<2.0.0)",
    "langchain-mistralai (>=1.1.2,<2.0.0)",
    "faiss-cpu (>=1.13.2,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "numpy (>=2.4.3,<3.0.0)",
    "ragas (>=0.4.3,<0.5.0)",
    "datasets (>=4.8.3,<5.0.0)",
    "mistralai (>=1.2.5,<2.0.0)",
    "graphviz (>=0.21,<0.22)",
    "langchain-community (>=0.4.2,<0.5.0)"
]

[tool.poetry]
packages = [{include = "project_11", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "ruff (>=0.15.7,<0.16.0)",
    "ipykernel (>=7.2.0,<8.0.0)"
]
